version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      terraform-modules:
        group-by: "dependency-name"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
