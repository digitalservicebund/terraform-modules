name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow to run this workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: "Install Terraform CLI"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
      - name: Check format
        run: |
          terraform fmt -recursive -check

  test:
    name: test (${{ matrix.terraform_module }}, terraform ${{ matrix.terraform_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "min" resolves to the version in the module's `required_version` constraint,
        # "latest" to the newest stable Terraform release.
        terraform_version: ["min", "latest"]
        terraform_module:
        terraform_module:
          [
            "stackit-object-storage",
            "stackit-state-bucket",
            "stackit-secrets-manager",
            "stackit-postgres-db",
            "stackit-identity-federation",
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: "Resolve Terraform version"
        id: terraform-version
        working-directory: ${{ matrix.terraform_module }}
        env:
          REQUESTED_VERSION: ${{ matrix.terraform_version }}
        run: |
          set -euo pipefail

          if [ "${REQUESTED_VERSION}" = "latest" ]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Expects a single lower-bound constraint of the form `required_version = ">=X.Y.Z"`
          constraint=$(grep -hE '^\s*required_version\s*=' ./*.tf | head -n1 || true)
          version=$(echo "${constraint}" | sed -nE 's/^\s*required_version\s*=\s*"\s*>=\s*([0-9]+\.[0-9]+\.[0-9]+)\s*".*$/\1/p')

          if [ -z "${version}" ]; then
            echo "::error::Could not determine minimum Terraform version in ${{ matrix.terraform_module }}. Expected 'required_version = \">=X.Y.Z\"', got: '${constraint}'"
            exit 1
          fi

          echo "Minimum required Terraform version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: "Install Terraform CLI"
        # Third-party action, pin to commit SHA!
        # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: "Show Terraform version"
        run: terraform version

      - name: "Terraform Init"
        run: terraform init
        working-directory: ${{ matrix.terraform_module }}

      - name: Terraform Test
        run: terraform test
        working-directory: ${{ matrix.terraform_module }}

  terraform-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        terraform_module:
          [
            "stackit-object-storage",
            "stackit-state-bucket",
            "stackit-secrets-manager",
            "stackit-postgres-db",
            "stackit-identity-federation",
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check and update terraform docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ matrix.terraform_module }}
          output-file: README.md
          output-method: inject
          args: "--hide-empty=true --lockfile=false"

      # This step is needed because the previous step runs in docker and breaks the permissions of the workspace
      - name: "Fix workspace permissions"
        run: |
          sudo chown -R $USER:$USER .

      - name: Commit and push terraform docs changes
        if: github.event.pull_request.head.repo.full_name == github.repository # Don't commit changes from forks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          MODULE_PATH: ${{ matrix.terraform_module }}
        run: |
          set -euo pipefail

          FILE_PATH="${MODULE_PATH}/README.md"

          git add "${FILE_PATH}"
          if git diff-index --cached --quiet HEAD -- "${FILE_PATH}"; then
            echo "No terraform-docs changes to commit for ${FILE_PATH}."
            exit 0
          fi

          FILE_CONTENT=$(base64 -i "${FILE_PATH}" | tr -d '\n')
          FILE_SHA=$(gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${PR_BRANCH}" --jq .sha)

          COMMIT_MESSAGE="docs(terraform): update ${MODULE_PATH} README"

          gh api "repos/${REPO}/contents/${FILE_PATH}" \
            -X PUT \
            -f message="${COMMIT_MESSAGE}" \
            -f content="${FILE_CONTENT}" \
            -f sha="${FILE_SHA}" \
            -f branch="${PR_BRANCH}"
